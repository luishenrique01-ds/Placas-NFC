<svg xmlns="http://www.w3.org/2000/svg" width="1374" height="1145" viewBox="0 0 1374 1145">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#4a3a2d"/><stop offset=".55" stop-color="#826448"/><stop offset="1" stop-color="#3d332b"/></linearGradient>
 <linearGradient id="counter" x2="0" y2="1"><stop stop-color="#8f6037"/><stop offset=".35" stop-color="#5d3b25"/><stop offset="1" stop-color="#2f2118"/></linearGradient>
